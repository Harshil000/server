<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        a {
            text-decoration: none;
            color: black;;
        }
    </style>
</head>

<body>
    <span class="links">
        <a href="/home">Home</a>
        <a href="/about">About</a>
        <a href="/contact">Contact</a>
    </span>
    <span class="toShow">

    </span>
    <script>
        let links = document.querySelectorAll('a');
        links.forEach(link => {
            link.addEventListener('click', (e) => {
                e.preventDefault();
                fetch(link.getAttribute('href'))
                    .then(res => res.text())
                    .then(data => {
                        document.querySelector('.toShow').innerHTML = data;
                    })
            })
        })
    </script>
</body>

</html>
